<mat-card class="input" appearance="outlined">
  <mat-card-header>
    <mat-card-title>Optimize Your Prompt</mat-card-title>
    <mat-card-subtitle>
      Paste a prompt and get a concise, AI-friendly version.
    </mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <mat-form-field appearance="outline" class="input__field">
      <mat-label>Original prompt</mat-label>
      <textarea
        matInput
        rows="10"
        [attr.maxlength]="maxLength"
        [value]="prompt()"
        (input)="setPrompt($any($event.target).value)"
        placeholder="Enter the prompt you want to improve…"
      ></textarea>
      <mat-hint align="end">{{ prompt().length }} / {{ maxLength }}</mat-hint>
    </mat-form-field>

    <mat-form-field appearance="outline" class="input__field">
      <mat-label>Optimization style</mat-label>
      <mat-select [value]="optimizationType()" (selectionChange)="setType($event.value)">
        @for (option of options; track option.value) {
          <mat-option [value]="option.value">{{ option.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </mat-card-content>

  <mat-card-actions align="end">
    <button mat-button type="button" (click)="clear()" [disabled]="loading() || !prompt()">
      Clear
    </button>
    <button
      mat-flat-button
      color="primary"
      type="button"
      (click)="submit()"
      [disabled]="loading() || prompt().trim().length < 5"
    >
      @if (loading()) {
        <mat-progress-spinner diameter="20" mode="indeterminate"></mat-progress-spinner>
      } @else {
        <mat-icon>auto_fix_high</mat-icon>
      }
      <span>{{ loading() ? 'Optimizing…' : 'Optimize Prompt' }}</span>
    </button>
  </mat-card-actions>
</mat-card>
